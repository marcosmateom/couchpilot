name: couchpilot

# ══════════════════════════════════════════════════════════════════════════════
# couchpilot — self-hosted media center, one compose file.
#
# Run `./mc setup` first — it writes .env and any generated config for you.
#
# Access flow:
#   LAN devices   → http://<server-ip>:<port>          → Caddy → containers
#   Tailscale     → http://<tailscale-ip>:<port>       → Caddy → containers
#   Domain (opt.) → https://<service>.yourdomain.com   → Caddy → containers
#
# Optional pieces are Compose profiles, toggled by COMPOSE_PROFILES in .env:
#   dns        Pi-hole + Unbound (network-wide ad blocking)
#   manga      Suwayomi (fetcher) + Komga (reader)
#   samba      Windows/macOS file sharing of your media folder
#   tailscale  Remote access over your tailnet
#   jackett    Legacy indexer proxy (Prowlarr covers most trackers)
#   rdtclient  Real-Debrid download client
#
# Networks:
#   media_net  172.28.0.0/24 – Caddy + all media services (+ Pi-hole web UI)
#   dns_net    172.29.0.0/24 – Unbound + Pi-hole (only exists with the dns profile)
#
# Security baseline (every service): no-new-privileges, runs as your user
# (PUID/PGID), explicit DNS servers, restart unless-stopped, config kept in
# ./<service>/config on disk. The one exception is tailscale, which needs
# NET_ADMIN + /dev/net/tun to create its VPN interface.
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ─── Caddy ──────────────────────────────────────────────────────────────────
  # Reverse proxy for every web UI. Two ways in, both always available:
  #   http://<server-ip>:<port>       (no DNS or domain needed)
  #   https://<service>.<your-domain> (only if you set up a domain — the vhosts
  #                                    live in caddy/sites/, generated by setup)
  # Custom image = stock Caddy + the Cloudflare DNS plugin (used only in
  # domain mode for Let's Encrypt DNS-01 certificates).
  caddy:
    build: ./caddy
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      # Per-service ports — direct IP access, no DNS required
      - "8096:8096"   # Jellyfin
      - "8989:8989"   # Sonarr
      - "7878:7878"   # Radarr
      - "6767:6767"   # Bazarr
      - "9696:9696"   # Prowlarr
      - "8080:8080"   # qBittorrent
      - "5055:5055"   # Jellyseerr
      - "9117:9117"   # Jackett     (jackett profile)
      - "6500:6500"   # RDTClient   (rdtclient profile)
      - "4567:4567"   # Suwayomi    (manga profile)
      - "25600:25600" # Komga       (manga profile)
      - "8081:8081"   # Pi-hole UI  (dns profile)
    networks:
      - media_net
    volumes:
      # Whole directory (not just the file) so host edits are picked up on
      # reload — single-file bind mounts go stale when the inode changes.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Only used in domain mode (ACME DNS-01). Harmless when empty.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── Jellyfin ───────────────────────────────────────────────────────────────
  # Media server. Media is mounted read-only (no accidental deletes).
  # Hardware transcoding (Intel/AMD/NVIDIA) is added by ./mc setup via the
  # generated compose.hwaccel.yml override — nothing GPU-specific lives here.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - media_net
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./jellyfin/config:/config
      # Transcode scratch + image cache on disk (safe default for any RAM size)
      - ./jellyfin/cache:/cache
      - ${DATA_DIR:-~/media}:/data:ro
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── Sonarr ─────────────────────────────────────────────────────────────────
  # TV show manager. Sees the same /data as qBittorrent, so imports are
  # instant hardlinks instead of slow copies.
  #   Settings → Media Management → Root folder: /data/tv
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./sonarr/config:/config
      - ${DATA_DIR:-~/media}:/data
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── Radarr ─────────────────────────────────────────────────────────────────
  # Movie manager. Same /data strategy as Sonarr.
  #   Settings → Media Management → Root folder: /data/movies
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./radarr/config:/config
      - ${DATA_DIR:-~/media}:/data
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── Bazarr ─────────────────────────────────────────────────────────────────
  # Subtitle manager. Writes .srt files next to each video; Jellyfin picks
  # them up on its next library scan.
  #   Settings → Sonarr: address sonarr, port 8989 (API key from Sonarr)
  #   Settings → Radarr: address radarr, port 7878 (API key from Radarr)
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./bazarr/config:/config
      - ${DATA_DIR:-~/media}:/data
    depends_on:
      - sonarr
      - radarr
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── Prowlarr ───────────────────────────────────────────────────────────────
  # Indexer manager — add your trackers once, it syncs them to Sonarr/Radarr.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./prowlarr/config:/config
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── qBittorrent ────────────────────────────────────────────────────────────
  # Torrent client. Forward port 6881 on your router for better speeds.
  #   Options → Downloads → Default save path:  /data/downloads/complete
  #   Options → Downloads → Keep incomplete in: /data/downloads/incomplete
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      media_net:
        # Static IP: Sonarr/Radarr connect by IP because qBittorrent's
        # host-header validation rejects dotless names like "qbittorrent"
        # (it accepts an IP-literal Host matching its own address).
        ipv4_address: ${QBIT_IP:-172.28.0.50}
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ./qbittorrent/config:/config
      - ${DATA_DIR:-~/media}:/data
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── Jellyseerr ─────────────────────────────────────────────────────────────
  # Request portal — family and friends ask for movies/shows here, it hands
  # the request to Sonarr/Radarr and tracks availability in Jellyfin.
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
    volumes:
      - ./jellyseerr/config:/app/config
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── FlareSolverr ───────────────────────────────────────────────────────────
  # Cloudflare-bypass helper for protected indexers. Internal only.
  #   Prowlarr → Settings → Indexers → add proxy → http://flaresolverr:8191
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ═══ Optional: dns profile — network-wide ad blocking ══════════════════════

  # ─── Unbound ────────────────────────────────────────────────────────────────
  # Upstream resolver for Pi-hole; forwards over encrypted DNS (DoT) to
  # Cloudflare Family (malware + adult filtering). Never exposed to the host.
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    profiles: ["dns"]
    security_opt:
      - no-new-privileges:true
    networks:
      dns_net:
        ipv4_address: ${UNBOUND_IP:-172.29.0.2}
    volumes:
      - ./unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    # Unbound resolves for itself; no upstream DNS needed from Docker
    dns:
      - 127.0.0.1
    # Override the image's health check — it probes :53, we listen on :5335
    healthcheck:
      test: ["CMD-SHELL", "drill @127.0.0.1 -p 5335 cloudflare.com > /dev/null || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 15s

  # ─── Pi-hole ────────────────────────────────────────────────────────────────
  # DNS sinkhole for your whole network. Point your router's DNS at this
  # machine and every device gets ad blocking for free.
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    profiles: ["dns"]
    security_opt:
      - no-new-privileges:true
    networks:
      dns_net:
        ipv4_address: ${PIHOLE_IP:-172.29.0.3}
      media_net:                  # Caddy proxies the web UI from media_net
    ports:
      # Bound to the LAN IP only — 0.0.0.0:53 collides with systemd-resolved
      - "${LAN_IP:-127.0.0.1}:53:53/tcp"
      - "${LAN_IP:-127.0.0.1}:53:53/udp"
    environment:
      TZ: ${TZ:-UTC}
      # Pi-hole v6 config — the FTLCONF_ prefix is required (v5 names are
      # silently ignored)
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-}
      FTLCONF_dns_upstreams: "${UNBOUND_IP:-172.29.0.2}#5335"
      FTLCONF_dns_listeningMode: "ALL"
      # Unbound already validates DNSSEC — no need to double-validate
      FTLCONF_dns_dnssec: "false"
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
    # Pi-hole IS the DNS — it resolves via itself, Unbound as startup fallback
    dns:
      - 127.0.0.1
      - ${UNBOUND_IP:-172.29.0.2}
    depends_on:
      - unbound

  # ═══ Optional: manga profile — manga fetcher + reader ══════════════════════

  # ─── Suwayomi ───────────────────────────────────────────────────────────────
  # "Sonarr for manga": subscribe to series, it auto-downloads new chapters
  # as CBZ into the manga folder. Runs natively as uid/gid 1000 (no PUID
  # support) — keep the manga folder owned by that user.
  # The downloads path is fixed inside the image — hence the odd mount target.
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:latest
    container_name: suwayomi
    hostname: suwayomi
    restart: unless-stopped
    profiles: ["manga"]
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      TZ: ${TZ:-UTC}
      BIND_IP: 0.0.0.0
      BIND_PORT: 4567
      DOWNLOAD_AS_CBZ: "true"
      AUTH_MODE: basic_auth
      AUTH_USERNAME: ${SUWAYOMI_USER:-}
      AUTH_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://flaresolverr:8191
      AUTO_DOWNLOAD_CHAPTERS: "true"
    volumes:
      - ./suwayomi/config:/home/suwayomi/.local/share/Tachidesk
      - ${MANGA_DIR:-./manga}:/home/suwayomi/.local/share/Tachidesk/downloads
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ─── Komga ──────────────────────────────────────────────────────────────────
  # Manga/comic library + web reader. Reads Suwayomi's output read-only.
  # Needs no internet — DNS is a deliberate black hole.
  #   First visit creates the admin account; add library folder /manga
  komga:
    image: gotson/komga:latest
    container_name: komga
    hostname: komga
    restart: unless-stopped
    profiles: ["manga"]
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - media_net
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./komga/config:/config
      - ${MANGA_DIR:-./manga}:/manga:ro
    dns:
      - 127.0.0.1

  # ═══ Optional: samba profile — Windows/macOS file sharing ══════════════════

  # ─── Samba ──────────────────────────────────────────────────────────────────
  # Exposes your media folder as a network share:  \\<server-ip>\Data
  # rslave propagation: if the host remounts the drive (e.g. after a power
  # cut), the new mount is visible inside the container automatically.
  samba:
    image: dockurr/samba:latest
    container_name: samba
    hostname: samba
    restart: unless-stopped
    profiles: ["samba"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "445:445"
    environment:
      TZ: ${TZ:-UTC}
      NAME: "Data"
      USER: ${SAMBA_USER:-samba}
      PASS: ${SAMBA_PASSWORD:-}
      UID: ${PUID:-1000}
      GID: ${PGID:-1000}
    volumes:
      - type: bind
        source: ${DATA_DIR:-~/media}
        target: /storage
        bind:
          propagation: rslave
    # File sharing needs no internet
    dns:
      - 127.0.0.1

  # ═══ Optional: tailscale profile — remote access ═══════════════════════════

  # ─── Tailscale ──────────────────────────────────────────────────────────────
  # Joins this machine to your tailnet. host network mode means the tailnet
  # IP behaves exactly like the machine's LAN IP — every service port above
  # works remotely at http://<tailscale-ip>:<port> with zero extra config.
  # NOTE: the one exception to the security baseline — a VPN needs NET_ADMIN
  # and the /dev/net/tun device to create its network interface.
  # Skip this profile if tailscaled is already installed on the host.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-couchpilot}
    restart: unless-stopped
    profiles: ["tailscale"]
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale/state:/var/lib/tailscale
    environment:
      # Auth key from https://login.tailscale.com/admin/settings/keys
      # Only used on first login; leave blank and check `./mc logs tailscale`
      # for a login URL instead. State persists in ./tailscale/state.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_HOSTNAME: ${TS_HOSTNAME:-couchpilot}

  # ═══ Optional: jackett profile — extra indexer proxy ═══════════════════════

  # ─── Jackett ────────────────────────────────────────────────────────────────
  # Legacy indexer proxy — only for trackers Prowlarr doesn't support yet.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    hostname: jackett
    restart: unless-stopped
    profiles: ["jackett"]
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      AUTO_UPDATE: "true"
    volumes:
      - ./jackett/config:/config
    dns:
      - 1.1.1.1
      - 1.0.0.1

  # ═══ Optional: rdtclient profile — Real-Debrid downloads ═══════════════════

  # ─── RDTClient ──────────────────────────────────────────────────────────────
  # Real-Debrid download client — Sonarr/Radarr treat it like qBittorrent.
  #   Settings → Download path: /data/downloads/complete
  rdtclient:
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    hostname: rdtclient
    restart: unless-stopped
    profiles: ["rdtclient"]
    security_opt:
      - no-new-privileges:true
    networks:
      - media_net
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./rdtclient/config:/data/db
      # Same downloads path as everything else so imports hardlink
      - ${DATA_DIR:-~/media}/downloads:/data/downloads
    dns:
      - 1.1.1.1
      - 1.0.0.1

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  media_net:
    name: couchpilot_media
    driver: bridge
    ipam:
      config:
        - subnet: ${MEDIA_SUBNET:-172.28.0.0/24}

  dns_net:
    name: couchpilot_dns
    driver: bridge
    ipam:
      config:
        - subnet: ${DNS_SUBNET:-172.29.0.0/24}

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  caddy_data:
  caddy_config:
