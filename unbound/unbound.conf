server:
    # Listen on all container interfaces, port 5335
    # (only Pi-hole on dns_net talks to this port — never exposed to the host)
    interface: 0.0.0.0
    port: 5335

    do-ip4: yes
    do-ip6: no          # disable IPv6 unless you configure IPv6 DoT servers
    do-udp: yes
    do-tcp: yes

    # Allow queries from private/Docker ranges only
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow

    # Don't expose server identity
    hide-identity: yes
    hide-version: yes

    # Hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-large-queries: yes
    use-caps-for-id: yes                  # 0x20 encoding (query ID randomisation)
    val-clean-additional: yes

    # Cache — keep sensible TTLs so Pi-hole requests don't hit upstream every time
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400

    # Performance
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    rrset-cache-size: 64m
    msg-cache-size: 32m
    so-rcvbuf: 1m

    # CA bundle for verifying TLS certificates when using DoT (DNS-over-TLS).
    # The mvance/unbound image ships these certs but Unbound won't use them
    # unless explicitly told where they are.
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    # Disable the subnet-cache module to avoid spurious warnings about
    # serve-expired and prefetch not working with ECS data.
    module-config: "validator iterator"

    # Logging — stderr only; Docker captures it
    logfile: ""
    verbosity: 0
    log-queries: no
    log-replies: no

# ─── Forward all queries to Cloudflare Family over DNS-over-TLS ───────────────
# 1.1.1.3 / 1.0.0.3 = Cloudflare Family (blocks malware + adult content).
# Prefer unfiltered? Swap for the 1.1.1.1 / 1.0.0.1 lines below.
forward-zone:
    name: "."
    forward-tls-upstream: yes

    # Primary: Cloudflare Family (malware + adult filtering)
    forward-addr: 1.1.1.3@853#cloudflare-dns.com
    forward-addr: 1.0.0.3@853#cloudflare-dns.com

    # Unfiltered alternative:
    # forward-addr: 1.1.1.1@853#cloudflare-dns.com
    # forward-addr: 1.0.0.1@853#cloudflare-dns.com
